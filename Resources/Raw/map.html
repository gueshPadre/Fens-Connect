    <script>
        //import Business from './businessesFile.js';

        let userLoc;

        function getBounds() {
            const bounds = map.getBounds();

            return JSON.stringify({

                east: bounds.getEast(),
                west: bounds.getWest()

        function flyToStartLoc(lng, lat) {
            map.flyTo({

                speed: 50,
                zoom: 14

            // Pin where user is
            userLoc = new mapboxgl.Marker({
                color: '#0E4C92'
            })
                .setLngLat([lng, lat])
                .addTo(map);

        }
        // All businesses that are already in

                }
                // distance to current location
                setDist(dist) {
                    this.dist = dist;
                }

                // Set Opening Hours
                setOpeningHours(mon, tue, wed, thu, fri, sat, sun) {
                    this.openedHours["Monday"] = mon;
                    this.openedHours["Tuesday"] = tue;
                    this.openedHours["Wednesday"] = wed;
                    this.openedHours["Thursday"] = thu;
                    this.openedHours["Friday"] = fri;
                    this.openedHours["Saturday"] = sat;
                    this.openedHours["Sunday"] = sun;
                }

                // Set Opening Hours
                setClosingHours(mon, tue, wed, thu, fri, sat, sun) {
                    this.closedHours["Monday"] = mon;
                    this.closedHours["Tuesday"] = tue;
                    this.closedHours["Wednesday"] = wed;
                    this.closedHours["Thursday"] = thu;
                    this.closedHours["Friday"] = fri;
                    this.closedHours["Saturday"] = sat;
                    this.closedHours["Sunday"] = sun;
                }

            }


            // VCC
            const vcc_b = new Business({
                name: 'Victoria Cannabis Company',
                safeword: 'bonkers',
                alternativeExit: 'Yes',
                imgSrc: 'https://pub-0c6f5b8a360c417e9ac2670079e7c2c9.r2.dev/vcc_marker1.png'
            });

            // Set opening and closing hours for VCC
            vcc_b.setOpeningHours('09:00', '09:00', '09:00', '09:00', '09:00', '09:00', '09:00');
            vcc_b.setClosingHours('23:00', '23:00', '23:00', '23:00', '23:00', '23:00', '23:00');

            const vcc = createMarker(vcc_b.imgSrc,
                -123.38619508440203, 48.43005130786145, vcc_b);
            // Get info of the marker
            markerList.push(vcc.getLngLat());
            nameList.push(vcc_b.name);
            //------

            // Big Wheel Burger
            const bwb_b = new Business({
                name: 'Big Wheel Burger',
                safeword: 'Duck Burger',
                alternativeExit: 'Yes',
                imgSrc: 'https://pub-0c6f5b8a360c417e9ac2670079e7c2c9.r2.dev/bwb_marker1.png'
            });

            // Set opening and closing hours for bwb
            bwb_b.setOpeningHours('11:00', '11:00', '11:00', '11:00', '11:00', '11:00', '11:00');
            bwb_b.setClosingHours('21:00', '21:00', '21:00', '21:00', '21:00', '21:00', '21:00');

            const bwg = createMarker(bwb_b.imgSrc,
                -123.38085452996481, 48.432426309628234, bwb_b);
            // Get info of the marker
            markerList.push(bwg.getLngLat());
            nameList.push(bwb_b.name);

            //------

            // Vancouver Art Gallery
            const vag_b = new Business({
                name: 'Vancouver Art Gallery',
                safeword: '',
                alternativeExit: '',
                imgSrc: 'https://pub-0c6f5b8a360c417e9ac2670079e7c2c9.r2.dev/vag_marker1.png'
            });
            const vag = createMarker(vag_b.imgSrc,
                -123.12060576585512, 49.28302361456653, vag_b);
            // Get info of the marker
            markerList.push(vag.getLngLat());
            nameList.push(vag_b.name);

            //------

            // Hilton Hotel
            const hil_b = new Business({
                name: 'Hilton Hotel',
                safeword: '',
                alternativeExit: '',
                imgSrc: 'https://pub-0c6f5b8a360c417e9ac2670079e7c2c9.r2.dev/hilton_marker1.png'
            });
            const hil = createMarker(hil_b.imgSrc,
                -123.11700532742789, 49.27995983925699, hil_b);
            // Get info of the marker
            markerList.push(hil.getLngLat());
            nameList.push(hil_b.name);

            //------

            // Social Corner Yaletown
            const scy_b = new Business({

            const scy = createMarker(scy_b.imgSrc,
                -123.11804358002048, 49.278864165446805, scy_b);
            // Get info of the marker
            markerList.push(scy.getLngLat());

        }

        function createMarker(url, lng, lat, bus) {
            // Check if Business is open first

            // 1. Get current time in minutes since midnight
            const now = new Date();
            const currentMinutes = (now.getHours() * 60) + now.getMinutes();
            const dayName = now.toLocaleString('en-US', { weekday: 'long' });

            // 2. Parse opening hour (e.g., "09:00") into minutes
            const openingTimeStr = bus.openedHours[dayName];
            const [openHours, openMinutes] = openingTimeStr.split(":").map(Number);
            const openingMinutes = (openHours * 60) + openMinutes;


            // 3. Parse closing hour (e.g., "23:00") into minutes
            const closingTimeStr = bus.closedHours[dayName];
            const [closeHours, closeMinutes] = closingTimeStr.split(":").map(Number);
            const closingMinutes = (closeHours * 60) + closeMinutes;

            // 3. Directly compare the numbers
            // if (currentMinutes < openingMinutes || currentMinutes >= closingMinutes) {
            //     // if Close, don't show marker
            //     //TODO: Offer an alternative.. For now just skip
            //     return;
            // }


            const markerAnchor = document.createElement('div');
            markerAnchor.className = 'marker-anchor';

            const markerPin = document.createElement('div');
            markerPin.className = 'marker-pin';

            const logoImg = document.createElement('img');
            logoImg.className = 'marker-logo';
            logoImg.src = url;
            logoImg.alt = bus && bus.name ? `${bus.name} marker` : 'Business marker';

            const arrowImg = document.createElement('img');
            arrowImg.className = 'marker-arrow';
            arrowImg.src = 'https://pub-0c6f5b8a360c417e9ac2670079e7c2c9.r2.dev/markerArrow.png';
            arrowImg.alt = '';

            markerPin.appendChild(logoImg);
            markerPin.appendChild(arrowImg);
            markerAnchor.appendChild(markerPin);
            // Add to list (dictionnary)
            businessList.push(bus);
            markerAnchor.addEventListener('click', () => {
                ShowBusinessInfo(bus);

            });

            const mk = new mapboxgl.Marker({ element: markerAnchor, anchor: 'center', offset: [0, 0] })
                .setLngLat([lng, lat])
                .addTo(map);
            return mk;

        }



        function drawRoute(routeGeoJson) {
            routeGeoJson = JSON.parse(routeGeoJson);
            map.getSource('routes').setData({
                type: 'FeatureCollection',
                features: [
                    {
                        type: 'Feature',
                        properties: {},
                        geometry: routeGeoJson

                    }
                ]
            });
        }

        function clearRoute() {
            map.getSource('routes').setData({
                type: 'FeatureCollection',
                features: []
            });

            const popupButton = document.getElementById('popupInfo');
            if (popupButton != null) {
                popupButton.remove();
            }
            shouldCancel = false;

        }

        function ShowBusinessInfo(business, isOnTimeout, busName) {
            if (isOnTimeout) {  // gotta get the business info from name list and marker list
                //alert("passed business name: " + busName);
                business = businessList.find(bus => bus.name === busName);
                if (typeof business === 'undefined' || !business) {
                    alert("Error: No Business were found!");
                }
            }

            const oldP = document.getElementById('popupInfo');
            if (oldP != null) {
                oldPopup = oldP;
            }

            const popup = document.createElement('div');

            popup.id = 'popupInfo';

            popup.classList.add('popupInfo');

            popup.innerHTML = "Business Name: <b>" + business.name + "</b><br>Safeword: <b>"
                + business.safeword + "</b><br>Alternative Exit: <b>" + business.alternativeExit + "</b>";

            //Close Button
            const closeButton = document.createElement('button');

            closeButton.id = 'closeButton';
            closeButton.innerHTML = 'x';

            closeButton.classList.add('closeButton');
            isInItinerary = isOnTimeout;

            closeButton.onclick = () => {
                oldPopup = null;
                if (isInItinerary == true) {
                    setTimeout(() => {
                        popup.classList.remove('show');
                        popup.appendChild(closeButton);
                        changeToMinimized();
                    }, 250);
                }
                else {
                    popup.classList.remove('show');

                    setTimeout(() => {

                        popup.remove();

                    }, 250);
                }
            };

            if (isOnTimeout == true) {
                // Temporary show the info then reduce
                popup.appendChild(closeButton);


                document.body.appendChild(popup);

                setTimeout(() => {

                    popup.classList.add('show');

                }, 10);
                if (!shouldCancel) {
                    setTimeout(() => {
                        popup.classList.remove('show');
                        changeToMinimized();
                    }, 2500);
                }
            }


            if (isOnTimeout != true) {


                // Directions Button
                const directionsButton = document.createElement('button');

                directionsButton.id = 'directionsButton';
                directionsButton.innerHTML = 'Get to ' + business.name;

                directionsButton.classList.add('directionsButton');

                directionsButton.onclick = () => {
                    window.location.href =
                        'app://getDirections?businessName=' +
                        encodeURIComponent(business.name);
                    // Handle if there's already a minimized Popup
                    if (oldPopup != null) {
                        oldPopup.remove();
                        oldPopup = null;
                    }
                    popup.classList.remove('maximizeButton');
                };


                popup.appendChild(directionsButton);

                popup.appendChild(closeButton);


                document.body.appendChild(popup);

                setTimeout(() => {

                    popup.classList.add('show');

                }, 10);
            }
        }

        function changeToMinimized() {
            const popupButton = document.getElementById('popupInfo');
            if (popupButton == null) {
                return;
            }

            if (popupButton.querySelector('#maximizeButton') != null) {
                return;
            }

            if (!popupButton.classList.contains('minimized')) {
                popupInfo = popupButton.innerHTML;      // Store the info before minimizing
            }

            popupButton.classList.add('minimized');
            popupButton.classList.remove('show');
            popupButton.innerHTML = "";

            const maximizeButton = document.createElement('button');
            maximizeButton.id = 'maximizeButton';
            maximizeButton.classList.add('maximizeButton');

            popupButton.appendChild(maximizeButton);
            //Activate the click to maximize
            maximizeButton.onclick = () => {
                popupButton.classList.remove('minimized');
                popupButton.innerHTML = popupInfo;      // Restore the info when maximizing
                popupButton.classList.add('show');
                popupButton.style.zIndex = '100';
                // If there's another one minimized, just remove the old popup dir button
                if (oldPopup != null) {
                    const dirButton = oldPopup.querySelector('#directionsButton');
                    if (dirButton != null) {
                        dirButton.remove();
                    }
                }
                else {
                    //remove directions Button if there's one
                    const dirButton = document.getElementById('directionsButton');
                    if (dirButton != null) {
                        dirButton.remove();
                    }

                }


                const closeButton = document.getElementById('closeButton');
                closeButton.innerHTML = 'x';
                closeButton.onclick = () => {
                    if (closeTimeoutID != null) {
                        clearTimeout(closeTimeoutID);
                        setTimeout(() => {
                            popupButton.classList.remove('show');
                            changeToMinimized();
                        }, 250);
                    }
                };
                // Reduce again after 3 seconds
                //if (!shouldCancel) {
                const closeTimeoutID = setTimeout(() => {
                    popupButton.classList.remove('show');
                    changeToMinimized();
                }, 3000);

                //}
            };

        }


        // function closePopup() {

        function getDistanceToBusiness(busName, dist) {
            const bus = businessList.find(b => b.name === busName);
            if (!bus) {
                return null;
            }
            bus.setDist(dist);
        }


        function displayFullList() {
            if (document.getElementById('busList') !== null) { return; }
            const busList = document.createElement('div');

            busList.id = 'busList';

            busList.classList.add('busList');

            for (const bus of businessList) {
                if (bus && bus.name && bus.imgSrc) {
                    const busLine = document.createElement('div');
                    busLine.className = 'bus-item';

                    const img = document.createElement('img');
                    img.className = 'bus-logo';
                    img.src = bus.imgSrc;
                    img.alt = `${bus.name} logo`;

                    img.addEventListener('click', () => {
                        ShowBusinessInfo(bus);

                        busList.classList.remove('show');

                        setTimeout(() => {

                            busList.remove();

                        }, 250);
                    });

                    const name = document.createElement('span');
                    name.className = 'bus-name';
                    name.textContent = bus.name;

                    const dist = document.createElement('div');
                    dist.className = 'bus-dist';
                    dist.textContent = bus.dist + ' km';

                    const lineImg = document.createElement('img');
                    lineImg.className = 'bus-line';
                    lineImg.src = 'https://pub-0c6f5b8a360c417e9ac2670079e7c2c9.r2.dev/Line.png';

                    busLine.appendChild(img);
                    busLine.appendChild(name);
                    name.appendChild(dist);
                    dist.appendChild(lineImg);
                    busList.appendChild(busLine);
                }
            }

            document.body.appendChild(busList);
            busList.classList.add('show');

            const closeButton = document.createElement('button');

            closeButton.id = 'closeButton';
            closeButton.innerHTML = 'x';

            closeButton.classList.add('closeButton');

            closeButton.onclick = () => {

                busList.classList.remove('show');

                setTimeout(() => {

                    busList.remove();

                }, 250);

            };
            busList.appendChild(closeButton);

        }



        function getMarkerList() {
            return JSON.stringify(markerList);
        }

        function getNameList() {
            return JSON.stringify(nameList);
        }

    </script>
