        function createMarker(lng, lat, bus) {
            // Check if Business is open first

            // 1. Get current time in minutes since midnight
            const now = new Date();
            const currentMinutes = (now.getHours() * 60) + now.getMinutes();
            const dayName = now.toLocaleString('en-US', { weekday: 'long' });

            // 2. Parse opening hour (e.g., "09:00") into minutes
            const openingTimeStr = bus.openedHours[dayName];
            const [openHours, openMinutes] = openingTimeStr.split(":").map(Number);
            const openingMinutes = (openHours * 60) + openMinutes;


            // 3. Parse closing hour (e.g., "23:00") into minutes
            const closingTimeStr = bus.closedHours[dayName];
            const [closeHours, closeMinutes] = closingTimeStr.split(":").map(Number);
            const closingMinutes = (closeHours * 60) + closeMinutes;

            // 3. Directly compare the numbers
            if (currentMinutes < openingMinutes || currentMinutes >= closingMinutes) {
                // if Close, don't show marker
                //bus.isClosed = true;
            }


            const markerAnchor = document.createElement('div');
            markerAnchor.className = 'marker-anchor';

            const markerPin = document.createElement('div');
            markerPin.className = 'marker-pin';

            const logoImg = document.createElement('img');
            logoImg.className = 'marker-logo';
            logoImg.src = bus.imgSrc;
            logoImg.alt = bus && bus.name ? `${bus.name} marker` : 'Business marker';

            const arrowImg = document.createElement('img');
            arrowImg.className = 'marker-arrow';
            arrowImg.src = 'https://pub-0c6f5b8a360c417e9ac2670079e7c2c9.r2.dev/markerArrow.png';
            arrowImg.alt = '';

            markerPin.appendChild(logoImg);

                ShowBusinessInfo(bus);

            });

            //we can choose to not show it or show it with a different style.
            //For now we just won't show it.
            const mk = new mapboxgl.Marker({ element: markerAnchor, anchor: 'center', offset: [0, 0] })
                .setLngLat([lng, lat])
                .addTo(map);
            return mk;

        }

        let stepIndex = 0;
        let touchStartX = 0;
        let touchEndX = 0;
        const minSwipeDistance = 50; // Minimum distance in pixels to count as a swipe
        function drawRoute(routeGeoJson, stepJson) {
            routeGeoJson = JSON.parse(routeGeoJson);
            map.getSource('routes').setData({
                type: 'FeatureCollection',
                features: [
                    {
                        type: 'Feature',
                        properties: {},
                        geometry: routeGeoJson

                    }
                ]
            });

            // Zoom to route
            const bounds = new mapboxgl.LngLatBounds();

            routeGeoJson.coordinates.forEach(coor => {
                bounds.extend(coor);
            });

            map.fitBounds(bounds, {
                padding: 50,
                maxZoomg: 17,
                duration: 1500
            });

            // Show steps as bottom popup

            // if there are any.. remove it first.
            const oldSteps = document.getElementById('dirStepsPanel');
            if (oldSteps != null) {
                oldSteps.remove();
            }
            stepIndex = 0;

            const dirStepsPanel = document.createElement('div');
            dirStepsPanel.id = 'dirStepsPanel';
            dirStepsPanel.classList.add('dirStepsPanel');

            const stepsText = document.createElement('p');
            stepsText.id = 'stepsText';
            stepsText.className = 'stepsText';

            const leftArrow = document.createElement('img');
            leftArrow.id = 'leftArrowBack';
            leftArrow.className = 'leftArrowBack';
            leftArrow.src = 'https://pub-0c6f5b8a360c417e9ac2670079e7c2c9.r2.dev/leftArrow.png';

            leftArrow.onclick = () => {
                goToPrevStep(stepJson);
            };

            const rightArrow = document.createElement('img');
            rightArrow.id = 'rightArrowForward';
            rightArrow.className = 'rightArrowForward';
            rightArrow.src = 'https://pub-0c6f5b8a360c417e9ac2670079e7c2c9.r2.dev/rightArrow.png';

            rightArrow.onclick = () => {
                goToNextStep(stepJson);
            };

            // Record where the finger first touches the screen
            dirStepsPanel.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            // Record where the finger leaves the screen and calculate direction
            dirStepsPanel.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe(stepJson);
            }, { passive: true });

            stepJson = JSON.parse(stepJson);

            stepsText.innerHTML = stepJson[stepIndex].Instruction + '<br>'
                + stepJson[stepIndex].Distance;
            leftArrow.hidden = true;

            dirStepsPanel.appendChild(leftArrow);
            dirStepsPanel.appendChild(rightArrow);
            dirStepsPanel.appendChild(stepsText);
            document.body.appendChild(dirStepsPanel);
        }

        function handleSwipe(stepJson) {
            const swipeDistance = touchEndX - touchStartX;

            // Check if the swipe was long enough to prevent accidental nudges
            if (Math.abs(swipeDistance) < minSwipeDistance) {
                return;
            }

            if (swipeDistance < 0) {
                // Swiped Left -> Go Forward
                goToNextStep(stepJson);
            } else {
                // Swiped Right -> Go Backward
                goToPrevStep(stepJson);
            }
        }

        function goToPrevStep(stepJson) {
            const leftArrow = document.getElementById('leftArrowBack');
            const rightArrow = document.getElementById('rightArrowForward');
            if (stepIndex > 0) {
                rightArrow.hidden = false;
                stepIndex--;
                UpdateStepInfo(stepJson);

                if (stepIndex == 0) { // turn arrow off on first instruction
                    leftArrow.hidden = true;
                }
            }
            else {
                leftArrow.hidden = true;
            }
        }

        function goToNextStep(stepJson) {
            const rightArrow = document.getElementById('rightArrowForward');
            const leftArrow = document.getElementById('leftArrowBack');
            const length = stepJson.length;
            if (stepIndex < length - 1) {
                leftArrow.hidden = false;
                stepIndex++;
                UpdateStepInfo(stepJson);

                // if we're at the last one, back one so we're at
                // the right index
                if (stepIndex == length) {
                    stepIndex--;
                }
                else if (stepIndex == length - 1) {
                    rightArrow.hidden = true; // turn the arrow off on the last instruction
                }
            }
            else {
                rightArrow.hidden = true;
            }
        }

        function UpdateStepInfo(stepJson) {
            const panel = document.getElementById('stepsText');

            panel.innerHTML = stepJson[stepIndex].Instruction + '<br>'
                + stepJson[stepIndex].Distance;
        }

        function changeToMinimized() {
            const popupButton = document.getElementById('popupInfo');
            if (popupButton == null) {
                return;
            }

            if (popupButton.querySelector('#maximizeButton') != null) {
                return;
            }

            if (!popupButton.classList.contains('minimized')) {
                popupInfo = popupButton.innerHTML;      // Store the info before minimizing
            }

            popupButton.classList.add('minimized');
            popupButton.classList.remove('show');
            popupButton.innerHTML = "";

            const maximizeButton = document.createElement('button');
            maximizeButton.id = 'maximizeButton';
            maximizeButton.classList.add('maximizeButton');

            popupButton.appendChild(maximizeButton);
            //Activate the click to maximize
            maximizeButton.onclick = () => {
                popupButton.classList.remove('minimized');
                popupButton.innerHTML = popupInfo;      // Restore the info when maximizing
                popupButton.classList.add('show');
                popupButton.style.zIndex = '100';
                // If there's another one minimized, just remove the old popup dir button
                if (oldPopup != null) {
                    const dirButton = oldPopup.querySelector('#directionsButton');
                    if (dirButton != null) {
                        dirButton.remove();
                    }
                }
                else {
                    //remove directions Button if there's one
                    const dirButton = document.getElementById('directionsButton');
                    if (dirButton != null) {
                        dirButton.remove();
                    }

                }


                const closeButton = document.getElementById('closeButton');
                closeButton.innerHTML = 'x';
                closeButton.onclick = () => {
                    if (closeTimeoutID != null) {
                        clearTimeout(closeTimeoutID);
                        setTimeout(() => {
                            popupButton.classList.remove('show');
                            changeToMinimized();
                        }, 250);
                    }
                };
                // Reduce again after 3 seconds
                //if (!shouldCancel) {
                const closeTimeoutID = setTimeout(() => {
                    popupButton.classList.remove('show');
                    changeToMinimized();
                }, 3000);

                //}
            };

        }

        function setDistanceToBusiness(busName, dist) {
            const bus = businessList.find(b => b.name === busName);
            if (!bus) {
                return null;
            }
            bus.setDist(dist);
        }


        function displayFullList() {
            if (document.getElementById('busList') !== null) { return; }
            const busList = document.createElement('div');

            busList.id = 'busList';

            busList.classList.add('busList');

            for (const bus of businessList) {
                if (bus && bus.name && bus.imgSrc) {
                    const busLine = document.createElement('div');
                    busLine.className = 'bus-item';

                    const img = document.createElement('img');
                    img.className = 'bus-logo';
                    img.src = bus.imgSrc;
                    img.alt = `${bus.name} logo`;

                    img.addEventListener('click', () => {
                        ShowBusinessInfo(bus);

                        busList.classList.remove('show');

                        setTimeout(() => {

                            busList.remove();

                        }, 250);
                    });

                    const name = document.createElement('span');
                    name.className = 'bus-name';
                    name.textContent = bus.name;

                    const dist = document.createElement('div');
                    dist.className = 'bus-dist';
                    if (!bus.dist) {
                        dist.textContent = "Closed"
                    }
                    else {
                        dist.textContent = bus.dist + ' km';
                    }

                    const lineImg = document.createElement('img');
                    lineImg.className = 'bus-line';
                    lineImg.src = 'https://pub-0c6f5b8a360c417e9ac2670079e7c2c9.r2.dev/Line.png';

                    busLine.appendChild(img);
                    busLine.appendChild(name);
                    name.appendChild(dist);
                    dist.appendChild(lineImg);
                    busList.appendChild(busLine);
                }
            }

            document.body.appendChild(busList);
            busList.classList.add('show');

            const closeButton = document.createElement('button');

            closeButton.id = 'closeButton';
            closeButton.innerHTML = 'x';

            closeButton.classList.add('closeButton');

            closeButton.onclick = () => {

                busList.classList.remove('show');

                setTimeout(() => {

                    busList.remove();

                }, 250);

            };
            busList.appendChild(closeButton);

        }

        function UpdateUserNameAndId(_userName, _userId, _showFriendsSetting) {
            userName = _userName;
            userId = _userId;
            userSettings.showFriends = _showFriendsSetting;
        }

        // Set the Alert markers that were already previously set
        // This is called from the C# side when the map is loaded
        function setAlertMarker(_markerId, _markerNote, _alertLocLng, _alertLocLat, _createdBy, _userId) {
            // Create the on map caution alert sign
            const alertEl = document.createElement('div');
            alertEl.className = 'alert-marker';

            const alertImg = document.createElement('img');
            alertImg.className = 'alert-Img';

            alertImg.src = 'https://pub-0c6f5b8a360c417e9ac2670079e7c2c9.r2.dev/caution.png';
            alertEl.appendChild(alertImg);

            const aM = new mapboxgl.Marker({
                element: alertEl
            })
                .setLngLat([_alertLocLng, _alertLocLat])
                .addTo(map);

            aM.id = _markerId;

            alertEl.addEventListener('click', () => {
                showAlertNote(aM);
            });
            // Add the alert to the local dictionnary
            alertDict[_markerId] = {
                note: _markerNote,
                createdBy: _createdBy,
                userId: _userId,
                lat: _alertLocLat,
                lng: _alertLocLng
            };
        }

        function getMarkerList() {
            return JSON.stringify(markerList);
        }

        function getNameList() {
            return JSON.stringify(nameList);
        }
